<style>
:root {
  --bg: #eef1f6;
  --card: #ffffff;
  --ink: #1b2130;
  --muted: #5a6477;
  --line: #d9dee7;
  --accent: #0d4099;
  --accent-ink: #ffffff;
  --accent-soft: #e4ecf9;
  --ok: #11632b;
  --ok-soft: #e3f4e8;
  --warn: #7a4f00;
  --warn-soft: #fff4d6;
  --err: #b00020;
  --err-soft: #fde7ea;
  --iper: #d90000;
  --paper: #ffffff;
  --radius: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151c;
    --card: #1b202a;
    --ink: #e6e9ef;
    --muted: #a3acbd;
    --line: #2f3644;
    --accent: #7fa7ff;
    --accent-ink: #0b1430;
    --accent-soft: #23304b;
    --ok: #7fd59b;
    --ok-soft: #173322;
    --warn: #f2c46b;
    --warn-soft: #3a2e12;
    --err: #ff8a9a;
    --err-soft: #3d1a20;
    --iper: #ff6b6b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12151c; --card: #1b202a; --ink: #e6e9ef; --muted: #a3acbd; --line: #2f3644;
  --accent: #7fa7ff; --accent-ink: #0b1430; --accent-soft: #23304b; --ok: #7fd59b; --ok-soft: #173322;
  --warn: #f2c46b; --warn-soft: #3a2e12; --err: #ff8a9a; --err-soft: #3d1a20; --iper: #ff6b6b;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--ink);
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
h2 { font-size: 17px; margin: 0; }
h3 { font-size: 15px; margin: 14px 0 6px; }
p { margin: 6px 0; }
.muto { color: var(--muted); font-size: 13px; }

/* ---------------------------------------------------------------- barra */
.barra {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 6px 10px;
  padding-top: max(6px, env(safe-area-inset-top));
  background: var(--card);
  border-bottom: 1px solid var(--line);
  min-width: 0;
}
.marchio { display: flex; align-items: center; gap: 8px; min-width: 0; }
.marchio img { flex: none; border-radius: 6px; }
.titolo { display: flex; flex-direction: column; min-width: 0; line-height: 1.15; }
.titolo b { font-size: 16px; }
.titolo span { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.azioni-file { display: flex; gap: 2px; flex: none; }
.azioni-file button {
  display: flex; flex-direction: column; align-items: center; gap: 1px;
  background: none; border: 0; border-radius: 8px; padding: 4px 6px; min-width: 40px;
  font-size: 11px; color: var(--muted);
}
.azioni-file button:hover:not(:disabled) { background: var(--accent-soft); color: var(--ink); }
.azioni-file button:disabled { opacity: .4; cursor: default; }
.azioni-file svg, .icona svg {
  width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8;
  stroke-linecap: round; stroke-linejoin: round;
}
@media (max-width: 520px) {
  .azioni-file span { display: none; }
  .azioni-file button { min-width: 36px; padding: 6px 5px; }
}

/* --------------------------------------------------------------- layout */
.layout {
  display: grid;
  grid-template-rows: minmax(200px, 44%) minmax(0, 1fr);
  min-height: 0;
}
@media (min-width: 900px) {
  .layout { grid-template-columns: minmax(380px, 460px) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
  .pannello { order: -1; border-right: 1px solid var(--line); }
}
.area-disegno {
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  min-height: 0;
  min-width: 0;
  background: var(--card);
  border-bottom: 1px solid var(--line);
}
.barra-disegno {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
  gap: 6px; padding: 6px 8px;
}
.strumenti { display: flex; gap: 6px; align-items: center; }
.strumenti select { padding: 4px 6px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); font-size: 13px; }
.icona { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 3px 5px; display: inline-flex; color: var(--ink); }
.icona:hover { background: var(--accent-soft); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.seg button {
  border: 0; background: none; padding: 5px 10px; font-size: 13px; color: var(--ink);
  border-right: 1px solid var(--line);
}
.seg button:last-child { border-right: 0; }
.seg button.attivo { background: var(--accent); color: var(--accent-ink); }
.seg button:disabled { color: var(--muted); opacity: .45; cursor: default; }
.disegno {
  position: relative;
  min-height: 0;
  background: var(--paper);
  touch-action: none;
  overflow: hidden;
  margin: 0 8px;
  border: 1px solid var(--line);
  border-radius: 8px;
  cursor: grab;
}
.disegno.trascina { cursor: grabbing; }
.disegno svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.disegno .bersaglio { cursor: pointer; pointer-events: all; }
.vuoto {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; color: #5a6477; padding: 16px;
}
.didascalia {
  display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; justify-content: space-between;
  padding: 4px 10px 6px; font-size: 12px; color: var(--muted); min-height: 26px;
}
.scala { display: inline-flex; align-items: center; gap: 6px; }
.scala input { width: 110px; }

/* -------------------------------------------------------------- pannello */
.pannello { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-height: 0; min-width: 0; }
.crediti {
  border: 0; border-top: 1px solid var(--line); background: var(--card); color: var(--muted);
  font-size: 11px; text-align: left; padding: 4px 12px calc(4px + env(safe-area-inset-bottom));
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer;
}
.crediti:hover { color: var(--accent); }
.schede { display: flex; background: var(--card); border-bottom: 1px solid var(--line); }
.schede button {
  flex: 1; border: 0; background: none; padding: 10px 6px; font-weight: 600; color: var(--muted);
  border-bottom: 3px solid transparent;
}
.schede button.attivo { color: var(--accent); border-bottom-color: var(--accent); }
.contenuto {
  overflow: auto;
  padding: 12px 16px calc(24px + env(safe-area-inset-bottom));
  -webkit-overflow-scrolling: touch;
}
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.chips button {
  border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 5px 11px; font-size: 13px;
}
.chips button.attivo { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.scheda-dati { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; margin-bottom: 12px; }
.riga { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0; }
.riga > label { display: inline-flex; align-items: center; gap: 6px; }
.selettore { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
.selettore select { flex: 1; min-width: 0; }
button.bottone, .selettore button {
  border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 6px 12px;
}
button.bottone:hover, .selettore button:hover { background: var(--accent-soft); }
button.primario {
  background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 9px; padding: 9px 16px; font-weight: 600;
}
button.primario:hover, a.primario:hover { filter: brightness(1.08); }
a.primario {
  display: inline-block; background: var(--accent); color: var(--accent-ink); border-radius: 9px; padding: 9px 16px;
  font-weight: 600; text-decoration: none;
}
.scarica { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
button.piccolo { padding: 3px 8px; font-size: 13px; }
button.elimina { border: 0; background: none; color: var(--muted); padding: 4px 6px; border-radius: 6px; }
button.elimina:hover { color: var(--err); background: var(--err-soft); }
select, input[type="number"], input[type="text"] {
  border: 1px solid var(--line); border-radius: 7px; background: var(--card); padding: 6px 7px; min-width: 0;
}
input[type="number"] { width: 100%; -moz-appearance: textfield; appearance: textfield; }
input[type="number"]::-webkit-outer-spin-button, input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
input.errato { border-color: var(--err); background: var(--err-soft); }
input:disabled { opacity: .5; }

table.tabella { width: 100%; border-collapse: collapse; font-size: 14px; }
table.tabella th { text-align: left; font-weight: 600; font-size: 12px; color: var(--muted); padding: 4px 4px; white-space: nowrap; }
table.tabella td { padding: 3px 4px; vertical-align: middle; }
table.tabella th.num { text-align: right; }
table.tabella td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
table.tabella td.id { color: var(--muted); font-weight: 600; width: 2.2em; }
table.tabella tr.selez td { background: var(--accent-soft); }
table.tabella tbody tr:nth-child(even) td.num { background: color-mix(in srgb, var(--line) 25%, transparent); }
.infinito { display: inline-flex; align-items: center; gap: 2px; font-size: 13px; white-space: nowrap; }
.cella-inf { display: flex; gap: 4px; align-items: center; }
.campione { display: inline-block; width: 14px; height: 14px; border-radius: 3px; vertical-align: middle; }
.tabella-scorre { overflow-x: auto; }

.gdl { display: grid; grid-template-columns: 4.5em minmax(0, 1fr) minmax(0, 1.2fr); gap: 6px 8px; align-items: center; }
.gdl .nome { font-weight: 600; }
.gdl label.val { display: flex; align-items: center; gap: 4px; }
.gdl label.val span { font-size: 13px; color: var(--muted); white-space: nowrap; }

.messaggio { border-radius: 8px; padding: 8px 10px; margin: 8px 0; font-size: 14px; }
.messaggio.ok { background: var(--ok-soft); color: var(--ok); }
.messaggio.warn { background: var(--warn-soft); color: var(--warn); }
.messaggio.err { background: var(--err-soft); color: var(--err); }
.messaggio.info { background: var(--accent-soft); color: var(--ink); }
ul.elenco-x { padding-left: 18px; margin: 6px 0; }
ul.elenco-x li { margin: 2px 0; }
.x { color: var(--iper); font-weight: 700; }
.nota { font-size: 13px; color: var(--muted); margin: 6px 0; }
details > summary { cursor: pointer; font-weight: 600; margin: 8px 0; }

/* ------------------------------------------------------------- dialoghi */
dialog {
  border: 0; border-radius: 14px; padding: 0; max-width: min(640px, calc(100vw - 24px)); width: 100%;
  max-height: calc(100dvh - 40px); background: var(--card); color: var(--ink);
  box-shadow: 0 10px 40px rgba(0, 0, 0, .3);
}
dialog::backdrop { background: rgba(10, 15, 30, .45); }
.dlg-corpo { display: flex; flex-direction: column; max-height: calc(100dvh - 40px); }
.dlg-corpo > header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.dlg-corpo > div { padding: 12px 16px; overflow: auto; }
.dlg-corpo > footer { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--line); }
.dlg-corpo > footer:empty { display: none; }
.lista-esempi { list-style: none; padding: 0; margin: 0; }
.lista-esempi button { width: 100%; text-align: left; border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 8px 10px; margin: 4px 0; }
.lista-esempi button:hover { background: var(--accent-soft); }
.legenda { display: grid; grid-template-columns: 1.2em 1fr; gap: 4px 8px; align-items: center; font-size: 14px; }
.legenda i { display: inline-block; width: 1em; height: 1em; border-radius: 3px; }

.avviso {
  position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px);
  background: #1b2130; color: #fff; padding: 10px 14px; border-radius: 10px; font-size: 14px; max-width: calc(100vw - 32px);
  opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 10;
}
.avviso.visibile { opacity: 1; transform: translateX(-50%); }

/* ------------------------------------------------------- schermi stretti */
.didascalia select { padding: 3px 6px; border-radius: 7px; border: 1px solid var(--line); background: var(--card); font-size: 12px; }
@media (max-width: 520px) {
  .lungo { display: none; }
  .seg button { padding: 5px 8px; }
  .contenuto { padding: 10px 12px calc(20px + env(safe-area-inset-bottom)); }
  .disegno { margin: 0 6px; }
}
</style>
</head>
